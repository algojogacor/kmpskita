<style>
:root{--bg:#0f172a;--card:#1e293b;--fg:#e2e8f0;--muted:#94a3b8;--accent:#38bdf8;--ok:#4ade80;--warn:#fbbf24;--bad:#f87171}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--fg);font:15px/1.5 system-ui,sans-serif;max-width:760px;margin:auto;padding-bottom:84px}
header{padding:18px 20px 10px;position:sticky;top:0;background:var(--bg);z-index:5}
h1{font-size:1.25em} #meta{color:var(--muted);font-size:.82em;margin-top:2px}
#err{display:none;background:#7f1d1d;color:#fecaca;padding:10px 14px;border-radius:10px;margin:10px 20px 0}
main{padding:6px 16px}
#count{color:var(--muted);font-size:.85em;margin:8px 4px 10px}
.card{background:var(--card);border-radius:14px;padding:14px 16px;margin-bottom:10px;border-left:4px solid var(--accent)}
.card.done{border-left-color:var(--ok)} .card.next{border-left-color:var(--warn)}
.time{font-weight:700;color:var(--accent);font-size:1.05em}
.mk{font-weight:600;font-size:1.02em;margin-top:2px}
.ruang,.dosen{color:var(--muted);font-size:.88em}
.badge{display:inline-block;padding:2px 9px;border-radius:999px;font-size:.72em;font-weight:700;margin-top:6px}
.badge.live{background:#14532d;color:#86efac;animation:pulse 1.6s infinite}
.badge.soon{background:#78350f;color:#fde68a}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.55}}
.empty{color:var(--muted);text-align:center;padding:28px}
.hdr{font-size:.95em;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin:16px 4px 8px}
.bar{background:#0f172a;border-radius:999px;height:8px;margin-top:8px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--ok);border-radius:999px;transition:width .5s}
.row{display:flex;justify-content:space-between;padding:3px 0;border-bottom:1px solid #33415555;font-size:.92em}
.row:last-child{border-bottom:0}
table{width:100%;border-collapse:collapse;font-size:.88em}
th,td{padding:7px 6px;text-align:left;border-bottom:1px solid #33415555}
th{color:var(--muted);font-size:.78em;text-transform:uppercase;letter-spacing:.03em}
nav{position:fixed;bottom:0;left:0;right:0;background:#0b1220ee;backdrop-filter:blur(8px);border-top:1px solid #334155;display:flex;max-width:760px;margin:auto}
nav button{flex:1;background:none;border:0;color:var(--muted);padding:10px 2px 12px;font-size:.68em;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px}
nav button .ic{font-size:1.3em;line-height:1}
nav button.on{color:var(--accent)}
a{color:var(--accent)}
.link-btn{display:block;background:var(--card);border-radius:14px;padding:14px 16px;margin-bottom:10px;text-decoration:none;color:var(--fg);border-left:4px solid var(--accent)}
.link-btn .t{font-weight:600} .link-btn .s{color:var(--muted);font-size:.85em}
.setup{background:var(--card);border-radius:14px;padding:18px;margin-top:10px}
.setup input{width:100%;background:#0f172a;color:var(--fg);border:1px solid #334155;border-radius:8px;padding:10px;font-size:.9em;margin:8px 0}
.setup button{background:var(--accent);color:#0f172a;border:0;padding:10px 18px;border-radius:8px;font-weight:700;cursor:pointer;font-size:.95em}
.hint{color:var(--muted);font-size:.78em;margin-top:8px}
#out{background:none;border:0;color:var(--muted);font-size:1.05em;cursor:pointer;padding:4px 6px;border-radius:8px}
#out:hover{background:#33415544;color:var(--fg)}
</style></head><body>
<header>
  <h1>📚 KK Lite</h1>
  <div style="display:flex;align-items:center;gap:8px">
    <div id="meta">memuat…</div>
    <button id="out" title="keluar / ganti akun">⏻</button>
  </div>
</header>
<div id="err"></div>
<main id="view"></main>
<nav id="nav">
  <button data-v="today" class="on"><span class="ic">🗓</span>Hari Ini</button>
  <button data-v="week"><span class="ic">📅</span>Minggu Ini</button>
  <button data-v="presensi"><span class="ic">✅</span>Presensi</button>
  <button data-v="nilai"><span class="ic">📖</span>Nilai</button>
  <button data-v="tugas"><span class="ic">📋</span>Tugas</button>
  <button data-v="status"><span class="ic">🎓</span>Status</button>
  <button data-v="elearn"><span class="ic">💻</span>E-Learning</button>
  <button data-v="panduan"><span class="ic">💡</span>Panduan</button>
</nav>
<script>
const BASE='https://apikampuskita-mahasiswa.unair.ac.id';
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=s=>{ if(!s) return ''; const m=String(s).match(/^(\d{4}-\d{2}-\d{2})/); return m? m[1].split('-').reverse().join('/') : s; };
const HARI_ID={Monday:'Senin',Tuesday:'Selasa',Wednesday:'Rabu',Thursday:'Kamis',Friday:'Jumat',Saturday:'Sabtu',Sunday:'Minggu'};

function getTok(){ return localStorage.getItem('kk_token')||''; }
async function api(path, method, params){
  const tok=getTok();
  if(!tok) throw new Error('token belum diatur');
  let url=BASE+path+'?token='+encodeURIComponent(tok);
  if(params){ const q=Object.entries(params).map(([k,v])=>k+'='+encodeURIComponent(v)).join('&'); url+='&'+q; }
  const opts={method:method||'GET',headers:{'Authorization':'Bearer '+tok}};
  const r=await fetch(url,opts);
  if(!r.ok) throw new Error('HTTP '+r.status+' — '+(await r.text()).slice(0,120));
  const j=await r.json();
  if(j && j.success===false) throw new Error(j.message||'error');
  return j;
}
const apiGet=p=>api(p,'GET');
const apiPost=(p,q)=>api(p,'POST',q);
// ---- HE-BAT (Moodle) — jalur iCal authtoken (token webservice nonaktif di HEBAT) ----
function getMoodleCal(){ return localStorage.getItem('kk_moodle_cal')||''; }
function moodleCalForm(msg){
  return '<div class="setup"><div class="mk">📋 Tugas HE-BAT (e-Learning)</div>'+
    '<div class="hint">HEBAT mematikan token aplikasi, tapi memberi <b>URL kalender pribadi</b> (berisi authtoken) yang bisa dibaca aplikasi lain. Cara mendapatkannya:</div>'+
    '<div class="hint">1. Buka <b>hebat.elearning.unair.ac.id</b> → login<br>'+
    '2. Buka <b>Calendar → Import or export calendars</b> (menu kiri / ikon kalender)<br>'+
    '3. Klik tombol <b>Get calendar URL</b> → salin URL yang muncul<br>'+
    '4. Tempel URL-nya di bawah lalu Simpan:</div>'+
    (msg?'<div class="hint" style="color:#f87171">'+esc(msg)+'</div>':'')+
    '<input id="mcal" type="url" placeholder="https://hebat…/calendar/export_execute.php?userid=…&authtoken=…" autocomplete="off">'+
    '<button onclick="saveMoodleCal()">Simpan Kalender HE-BAT</button>'+
    '<div class="hint" style="margin-top:14px;text-align:center;opacity:.7">Cukup sekali — URL ini berisi kunci khusus akunmu, tidak perlu login lagi.</div></div>';
}
function saveMoodleCal(){
  const v=$('mcal').value.trim();
  if(!/authtoken=[a-f0-9]{32,}/i.test(v)){ $('view').innerHTML=moodleCalForm('URL tidak mengandung authtoken — periksa lagi salinannya'); return; }
  localStorage.setItem('kk_moodle_cal',v);
  document.querySelector('nav button[data-v="tugas"]').click();
}
function moodleCalParts(u){
  const m=(u||'').match(/userid=(\d+)[^&]*&authtoken=([a-f0-9]{32,})/i);
  return m?{userid:m[1],authtoken:m[2]}:null;
}
async function moodleCalFetch(){
  const p=moodleCalParts(getMoodleCal());
  if(!p) throw new Error('URL kalender HE-BAT tidak valid');
  const r=await fetch('/api/moodle-cal?userid='+p.userid+'&authtoken='+p.authtoken);
  const j=await r.json();
  if(!r.ok||j.error) throw new Error(j.error||'gagal ambil kalender HE-BAT');
  return j.events||[];
}
const icsDate=v=>{
  if(!v) return 0;
  const s=v.replace(/Z$/,'');
  const d=new Date(s.slice(0,4)+'-'+s.slice(4,6)+'-'+s.slice(6,8)+'T'+s.slice(9,11)+':'+s.slice(11,13)+':'+s.slice(13,15)+'Z');
  return isNaN(d)?0:Math.floor(d.getTime()/1000);
};
const cleanName=s=>(s||'').replace(/\s+(is due|due)$/i,'').trim();
const courseName=c=>{ const p=(c||'').split(' - '); return p.length>=3?p[2]:c; };
function moodleCalLogout(){ localStorage.removeItem('kk_moodle_cal'); document.querySelector('nav button[data-v="tugas"]').click(); }
const fmtTS=ts=>{ if(!ts) return '—'; const d=new Date(ts*1000); return d.toLocaleDateString('id-ID',{day:'2-digit',month:'short'})+' '+d.toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit'}); };

// ---- setup: login email+password ATAU paste token ----
function setupView(){
  $('meta').textContent='masuk dulu';
  $('view').innerHTML='<div class="setup"><div class="mk">🔐 Masuk — akun Kampus Kita kamu</div>'+
    '<input id="lemail" type="email" placeholder="email kampus (nama@student.unair.ac.id)" autocomplete="username">'+
    '<input id="lpass" type="password" placeholder="password" autocomplete="current-password">'+
    '<button onclick="doLogin()" id="lbtn">Masuk</button>'+
    '<div class="hint" id="lerr" style="display:none;color:#f87171"></div>'+
    '<div class="hint" style="margin-top:14px;text-align:center;opacity:.7">— atau —</div>'+
    '<div class="mk" style="margin-top:10px">🔑 Sudah punya token?</div>'+
    '<input id="tok" type="password" placeholder="paste JWT / token di sini" autocomplete="off">'+
    '<button onclick="saveTok()">Simpan Token</button>'+
    '<div class="hint">Token cuma disimpan di perangkat ini (localStorage). Login lewat server Vercel hanya untuk meneruskan — tidak ada yang disimpan.</div>'+
    '<div class="hint" style="text-align:center;opacity:.7;margin-top:10px">Bingung? buka tab <b>💡 Panduan</b> untuk tutorial lengkap.</div></div>';
}
function saveTok(){
  const v=$('tok').value.trim();
  if(!v) return;
  localStorage.setItem('kk_token',v);
  history.replaceState(null,'',location.pathname);
  boot();
}
async function doLogin(){
  const em=$('lemail').value.trim(), pw=$('lpass').value;
  const err=$('lerr'); err.style.display='none';
  if(!em||!pw){ err.textContent='isi email dan password dulu'; err.style.display='block'; return; }
  const btn=$('lbtn'); btn.disabled=true; btn.textContent='Masuk…';
  try{
    const r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:em,password:pw})});
    const j=await r.json();
    if(!r.ok||!j.token) throw new Error(j.error||'login gagal');
    localStorage.setItem('kk_token',j.token);
    history.replaceState(null,'',location.pathname);
    boot();
  }catch(e){
    err.textContent=e.message+(e.message.includes('fetch')?' — deploy ini tidak punya /api/login, pakai paste token.': '');
    err.style.display='block';
    btn.disabled=false; btn.textContent='Masuk';
  }
}
// dukungan ?t=TOKEN (misal dari kk_lite) — sekali pakai
(function(){
  const m=location.search.match(/[?&]t=([^&]+)/);
  if(m){ try{ localStorage.setItem('kk_token',decodeURIComponent(m[1])); }catch(e){} history.replaceState(null,'',location.pathname); }
})();

function cardJadwal(x){
  const now=new Date(), cur=now.getHours()*60+now.getMinutes();
  const [a,b]=x.jam.split('–');
  let m0=0,m1=0,cls='',badge='';
  if(a){const p=a.trim().split(':'); m0=+p[0]*60+(+p[1]||0);}
  if(b){const p=b.trim().split(':'); m1=+p[0]*60+(+p[1]||0);}
  if(m0&&cur>=m0&&cur<=m1) cls='done',badge='<span class="badge live">● PRESENSI SEKARANG</span>';
  else if(m0>cur&&m0-cur<=120) cls='next',badge='<span class="badge soon">sebentar lagi</span>';
  return '<div class="card '+cls+'"><div class="time">'+x.jam+'</div><div class="mk">'+esc(x.mk)+'</div>'+
    '<div class="ruang">📍 '+esc(x.ruang)+'</div><div class="dosen">'+esc(x.dosen)+'</div>'+badge+'</div>';
}
function rowsJadwal(j){ // flatten {"data":[{"Senin":[...]}]}
  const out=[];
  const d=(j&&j.data)||j;
  if(Array.isArray(d)) for(const r of d){
    if(r&&typeof r==='object'&&Object.values(r).every(v=>Array.isArray(v))){ for(const lst of Object.values(r)) out.push(...lst); }
    else if(r) out.push(r);
  }
  return out;
}
const VIEWS={
  today:async()=>{
    const j=await apiPost('/akademik/jadwal-kuliah');
    const rows=rowsJadwal(j), today=HARI_ID[new Date().getDay()==0?6:new Date().getDay()-1] || '';
    const dayName=new Intl.DateTimeFormat('id-ID',{weekday:'long'}).format(new Date());
    const items=rows.filter(r=>String(r.NM_JADWAL_HARI||'').toLowerCase()===dayName.toLowerCase())
      .map(r=>({jam:r.JAM||'',mk:r.NM_MATA_KULIAH,ruang:[r.NM_RUANGAN,r.NM_GEDUNG].filter(Boolean).join(' • '),dosen:r.NM_DOSEN}))
      .sort((a,b)=>a.jam<b.jam?-1:1);
    $('view').innerHTML='<div id="count">'+items.length+' jadwal hari ini</div>';
    $('view').innerHTML+=items.length?items.map(cardJadwal).join(''):'<div class="empty">✅ Hari ini tidak ada kuliah.</div>';
  },
  week:async()=>{
    const j=await apiPost('/akademik/jadwal-kuliah');
    const rows=rowsJadwal(j), byday={};
    for(const r of rows){ const h=r.NM_JADWAL_HARI||'?'; (byday[h]=byday[h]||[]).push({jam:r.JAM,mk:r.NM_MATA_KULIAH,ruang:[r.NM_RUANGAN,r.NM_GEDUNG].filter(Boolean).join(' • '),dosen:r.NM_DOSEN}); }
    let h='';
    for(const d of ['Senin','Selasa','Rabu','Kamis','Jumat','Sabtu','Minggu']){
      if(!byday[d]) continue;
      h+='<div class="hdr">'+d+'</div>'+byday[d].sort((a,b)=>a.jam<b.jam?-1:1).map(cardJadwal).join('');
    }
    $('view').innerHTML=h||'<div class="empty">Belum ada jadwal.</div>';
  },
  presensi:async()=>{
    const j=await apiGet('/kemahasiswaan/presensi-kuliah');
    const rows=rowsJadwal(j);
    $('view').innerHTML='<div id="count">'+rows.length+' mata kuliah</div>'+
      rows.map(x=>'<div class="card"><div class="mk">'+esc(x.NM_MATA_KULIAH)+' <span style="color:var(--muted);font-size:.85em">['+esc(x.NAMA_KELAS)+'] '+x.KREDIT_SEMESTER+' SKS</span></div>'+
      '<div class="ruang">hadir '+x.HADIR+' / '+x.TM+' &nbsp;·&nbsp; <b>'+x.PROSEN+'%</b></div>'+
      '<div class="bar"><i style="width:'+Math.min(100,+x.PROSEN)+'%"></i></div></div>').join('');
  },
  nilai:async()=>{
    const s=await apiGet('/akademik/semester-khs');
    const sms=(s.data||[])[0];
    if(!sms){ $('view').innerHTML='<div class="empty">Belum ada semester.</div>'; return; }
    const j=await apiPost('/kemahasiswaan/riwayat-khs',{semester:sms.ID_SEMESTER});
    const rows=rowsJadwal(j);
    let tot=0; rows.forEach(r=>tot+=+r.SKS||0);
    $('view').innerHTML='<div id="count">'+sms.TAHUN_AJARAN+' '+sms.NM_SEMESTER+' · '+rows.length+' MK · total '+tot+' SKS</div>'+
      '<div class="card" style="padding:8px 12px"><table><tr><th>Kode</th><th>Mata Kuliah</th><th>SKS</th><th>Nilai</th></tr>'+
      rows.map(x=>'<tr><td style="color:var(--muted)">'+esc(x.KODE)+'</td><td>'+esc(x.NAMA)+'</td><td>'+x.SKS+'</td><td><b>'+esc(x.NILAI_HURUF)+'</b></td></tr>').join('')+'</table></div>';
  },
  status:async()=>{
    const j=await apiGet('/akademik/status-mhs');
    const r=(j.data||[])[0]||{};
    const s2=await apiGet('/akademik/sks-aktif'); const r2=(s2.data||[])[0]||{};
    const pay=await apiGet('/kemahasiswaan/pembayaran');
    const kal=await apiGet('/akademik/kalender-akademik');
    $('view').innerHTML='<div class="card">'+
      '<div class="mk">'+esc(r.NM_PROGRAM_STUDI)+'</div>'+
      '<div class="row"><span>NIM</span><b>'+esc(r.NIM_MHS)+'</b></div>'+
      '<div class="row"><span>Angkatan</span><b>'+esc(r.THN_ANGKATAN_MHS)+'</b></div>'+
      '<div class="row"><span>Status</span><b>'+esc(r.NM_STATUS_PENGGUNA)+'</b></div>'+
      '<div class="row"><span>Jenjang</span><b>'+esc(r.NM_JENJANG)+'</b></div>'+
      '<div class="row"><span>SKS</span><b>'+r2.SKS_TEMPUH+' ('+r2.JUM_MK+' MK)</b></div>'+
      '</div>'+
      '<div class="hdr">Pembayaran</div><div class="card">'+
      (pay.data||[]).map(x=>'<div class="row"><span>'+esc(x.TAHUN_AJARAN+' '+x.NM_SEMESTER)+'</span><b>'+esc(x.NAMA_STATUS)+' · Rp '+Number(x.NOMINAL_BAYAR).toLocaleString('id-ID')+'</b></div>').join('')+'</div>'+
      '<div class="hdr">Kalender Akademik</div><div class="card">'+
      (kal.data||[]).map(x=>'<div class="row"><span>'+esc(x.NM_KEGIATAN)+'</span><b style="color:var(--muted)">'+fmt(x.TGL_MULAI_JSF)+' s.d. '+fmt(x.TGL_SELESAI_JSF)+'</b></div>').join('')+'</div>';
  },
  elearn:()=>{
    $('view').innerHTML=
      '<a class="link-btn" href="https://hebat.elearning.unair.ac.id/hebat-v2/" target="_blank" rel="noopener"><div class="t">💻 HE-BAT (e-Learning UNAIR)</div><div class="s">hebat.elearning.unair.ac.id/hebat-v2/ · buka di tab baru</div></a>'+
      '<a class="link-btn" href="https://apikampuskita-mahasiswa.unair.ac.id/" target="_blank" rel="noopener"><div class="t">🏛 Portal Kampus Kita</div><div class="s">sumber data</div></a>';
  },
  tugas:async()=>{
    if(!getMoodleCal()){ $('view').innerHTML=moodleCalForm(''); return; }
    $('view').innerHTML='<div class="empty">memuat tugas HE-BAT…</div>';
    const now=Math.floor(Date.now()/1000);
    let evs=[];
    try{ evs=await moodleCalFetch(); }
    catch(e){ $('view').innerHTML=moodleCalForm(e.message); return; }
    let links={tasks:[],courses:[]};
    // Data per-user (hebat-links-<userid>.json) bila ada: userid dari URL
    // kalender -> mahasiswa fakultas/kelas lain bisa punya file sendiri.
    // Fallback: hebat-links.json (data pemilik) utk pengguna tanpa file.
    const uid=(moodleCalParts(getMoodleCal())||{}).userid||'';
    let hasOwn=false;
    try{ links=await (await fetch('hebat-links'+(uid?'-'+uid:'')+'.json')).json(); hasOwn=true; }
    catch(e){ if(uid) try{ links=await (await fetch('hebat-links.json')).json(); }catch(e2){} }
    // indeks dari hebat-links.json: aktivitas -> kursus/section; nama -> url; id kursus
    const actByUrl={}, actByName={};
    (links.courses||[]).forEach(c=>(c.sections||[]).forEach(s=>(s.activities||[]).forEach(a=>{
      actByUrl[a.href]=actByUrl[a.href]||{course:c,section:s,act:a};
      actByName[(a.name||'').toLowerCase()]=actByUrl[a.href];
    })));
    const linkFor=n=>{ const nl=n.toLowerCase(); return (links.tasks||[]).find(t=>{ const tn=t.name.toLowerCase(); return tn===nl||tn.includes(nl)||nl.includes(tn); }); };
    const list=evs.filter(e=>(e.SUMMARY||'').toLowerCase().includes('due'))
      .map(e=>{
        const name=cleanName(e.SUMMARY);
        const lf=linkFor(name);
        // hebat-links.json course-global utk instance KELAS ini (id kursus & cmid
        // beda tiap kelas) -> tombol hanya valid kalau kelas di kalender pengguna
        // cocok dgn kelas di data sync (kalender berisi fullname: ... - 2025 - A-2).
        const calCls=((e.CATEGORIES||'').split(' - ').pop()||'').trim();
        const hit0=(lf&&lf.url)?(actByUrl[lf.url]||null):(actByName[name.toLowerCase()]||null);
        const clsOk=!hit0||!calCls||!hit0.course||!hit0.course.class||calCls===hit0.course.class;
        const hit=clsOk?hit0:null;
        const course=hit?hit.course:null;
        return {name,
          courseName:course?course.name:courseName(e.CATEGORIES),
          courseClass:course?(course.class||''):'',
          due:icsDate(e.DTSTART),
          url:clsOk?((hit?hit.act.href:'')||(lf&&lf.url?lf.url:'')):'',
          hit};
      });
    list.sort((a,b)=>a.due-b.due);
    const badge=a=>{
      if(!a.due) return '<span style="color:var(--muted);font-size:.75em">tanpa tanggal</span>';
      const left=a.due-now;
      if(left<0) return '<b style="color:#f87171">LEWAT '+fmtTS(a.due)+'</b>';
      if(left<86400) return '<b style="color:#fbbf24">SEBENTAR '+fmtTS(a.due)+'</b>';
      return '<span style="color:var(--muted);font-size:.82em">H-'+Math.ceil(left/86400)+' · '+fmtTS(a.due)+'</span>';
    };
    const btnStyle='display:inline-block;padding:5px 12px;border-radius:8px;font-size:.8em;text-decoration:none;margin-right:6px';
    const btns=a=>{
      let b='';
      if(a.url) b+='<a class="link-btn" style="'+btnStyle+'background:var(--accent);color:#fff" href="'+esc(a.url)+'" target="_blank" rel="noopener">📄 buka tugas</a>';
      if(a.courseName&&a.hit&&a.hit.course) b+='<a class="link-btn" style="'+btnStyle+'background:transparent;border:1px solid var(--accent);color:var(--accent)" href="'+esc(a.hit.course.url)+'" target="_blank" rel="noopener">🏛 buka kursus</a>';
      return b;
    };
    const detail=a=>{
      if(!a.hit||!a.hit.section||!a.hit.section.summary) return '';
      return '<details style="margin-top:8px;font-size:.82em"><summary style="cursor:pointer;color:var(--accent)">📝 isi penugasan / info</summary>'+
        (a.hit.section.name?'<div style="margin-top:6px;font-weight:600;color:var(--fg)">'+esc(a.hit.section.name)+'</div>':'')+
        '<div style="margin-top:4px;white-space:pre-wrap;line-height:1.5;color:var(--muted)">'+esc(a.hit.section.summary)+'</div></details>';
    };
    let html='<div style="display:flex;justify-content:space-between;align-items:center">'+
      '<div class="hdr" style="margin:0">Tugas & Deadline</div>'+
      '<span style="font-size:.75em;color:var(--muted)"><a href="https://hebat.elearning.unair.ac.id/" target="_blank" rel="noopener">buka HE-BAT</a> · <a href="javascript:moodleCalLogout()">ganti kalender</a></span></div>';
    if(!list.length) html+='<div class="empty">tidak ada tugas ber-deadline di kalender HE-BAT</div>';
    list.forEach(a=>{ html+='<div class="card" style="padding:10px 14px;margin-bottom:8px;border-left:4px solid '+((a.due&&a.due<now)?'#f87171':(a.due&&a.due-now<86400?'#fbbf24':'var(--accent)'))+'">'+
      '<div style="font-weight:600;font-size:.92em">'+esc(a.name)+'</div>'+
      '<div style="color:var(--muted);font-size:.8em">'+esc(a.courseName)+(a.courseClass?' · '+esc(a.courseClass):'')+'</div>'+
      badge(a)+
      (btns(a)?'<div style="margin-top:6px">'+btns(a)+'</div>':'')+
      detail(a)+
      '</div>'; });
    // ✨ Bantu teman (atau dirimu) buat data tombol: generator jalan di
    // browser pemilik akun HE-BAT (tanpa install, tanpa password lewat web ini),
    // hasilnya diunggah -> api/links-upload -> auto-commit ke repo.
    if(uid&&!hasOwn){
      html+='<details class="card" style="margin-top:12px;padding:12px 14px">'+
        '<summary style="cursor:pointer;font-weight:600;color:var(--accent)">✨ belum ada tombol tugas? buat datamu sendiri (~2 menit, tanpa install)</summary>'+
        '<div style="font-size:.82em;color:var(--muted);margin:8px 0">Data dibuat di browser kamu sendiri (sesi login HE-BAT kamu) — tidak ada password yang melewati web ini.</div>'+
        '<ol style="margin:0 0 10px 20px;font-size:.85em;line-height:1.7">'+
          '<li>Di tab baru: buka <b>hebat.elearning.unair.ac.id</b> (login). Tekan <b>F12</b> → tab <b>Console</b>. Kalau muncul peringatan, ketik <b>allow pasting</b> lalu Enter.</li>'+
          '<li>Salin kode di bawah → tempel di Console → Enter. File <b>hebat-links-…json</b> terunduh.</li>'+
          '<li>Seret file itu ke kotak di bawah.</li>'+
        '</ol>'+
        '<textarea id="gencode" readonly spellcheck="false" style="width:100%;min-height:130px;box-sizing:border-box;background:#0f172a;color:var(--fg);border:1px solid #334155;border-radius:8px;padding:8px;font-family:ui-monospace,Consolas,monospace;font-size:.7em;white-space:pre;overflow:auto" placeholder="memuat kode…"></textarea>'+
        '<button id="gencopybtn" onclick="copyGenCode()" style="background:var(--accent);color:#0f172a;border:0;padding:6px 14px;border-radius:8px;font-weight:700;cursor:pointer;font-size:.85em;margin-top:6px">📋 salin kode</button>'+
        '<div id="dropzone" style="margin-top:10px;border:2px dashed var(--accent);border-radius:10px;padding:18px;text-align:center;font-size:.85em;color:var(--muted);cursor:pointer">📂 seret file <b style="color:var(--fg)">hebat-links-…json</b> ke sini — atau <b style="color:var(--accent)">pilih file</b>'+
          '<div style="font-size:.72em;margin-top:4px">URL divalidasi (hanya hebat.elearning.unair.ac.id) · tanpa password</div></div>'+
        '<input type="file" id="genfile" accept=".json,application/json" style="display:none">'+
        '<div id="upstatus" style="font-size:.85em;margin-top:8px;color:var(--muted)"></div>'+
      '</details>';
    }
    $('view').innerHTML=html;
    if(uid&&!hasOwn) initGenHelp();
  },
  panduan:async()=>{
    const s=(t,h)=>'<details class="card" style="padding:12px 14px;margin-bottom:8px"><summary style="cursor:pointer;font-weight:600">'+t+'</summary>'+h+'</details>';
    $('view').innerHTML=
      '<div class="hdr">💡 Panduan & Cara Pakai</div>'+
      '<div class="hint" style="margin:6px 0 12px">KK Lite = satu aplikasi untuk dua sistem UNAIR: <b>Kampus Kita</b> (jadwal, presensi, nilai, status) dan <b>HE-BAT</b> (tugas & e-learning). Semua data yang tampil = <b>akunmu sendiri</b>.</div>'+
      s('🔐 1. Masuk (akun Kampus Kita)',
        '<ol style="margin:6px 0 4px 20px;line-height:1.8">'+
        '<li>Ketik <b>email kampus</b> (<i>nama@student.unair.ac.id</i>) dan <b>password Kampus Kita</b> — bukan NIM.</li>'+
        '<li>Klik <b>Masuk</b>. Token tersimpan aman di perangkatmu.</li>'+
        '<li>Ganti akun: tombol <b>⏻</b> di pojok kanan atas.</li></ol>'+
        '<div class="hint">Jadwal, presensi, dan nilai sama persis dengan aplikasi resmi Kampus Kita.</div>')+
      s('📋 2. Tugas HE-BAT (URL kalender pribadi)',
        '<ol style="margin:6px 0 4px 20px;line-height:1.8">'+
        '<li>Buka <b>hebat.elearning.unair.ac.id</b> → login.</li>'+
        '<li>Buka <b>Calendar → Import or export calendars</b> (menu kiri / ikon kalender).</li>'+
        '<li>Klik tombol <b>Get calendar URL</b> → salin URL yang muncul.</li>'+
        '<li>Kembali ke web ini → tab <b>📋 Tugas</b> → tempel URL → <b>Simpan Kalender HE-BAT</b>.</li></ol>'+
        '<div class="hint">URL itu berisi <b>kunci khusus akunmu</b> — jangan dibagikan ke siapa pun. Cukup sekali; deadline muncul otomatis tanpa login HE-BAT lagi.</div>')+
      s('✨ 3. Tombol tugas (📄 buka tugas · 🏛 buka kursus · 📝 isi penugasan)',
        '<div class="hint" style="line-height:1.8">Tombol muncul kalau data untuk akunmu ada. Kalau belum, tab <b>📋 Tugas</b> menampilkan bagian <b>“buat tombolmu”</b>:</div>'+
        '<ol style="margin:6px 0 4px 20px;line-height:1.8">'+
        '<li>Buka <b>hebat.elearning.unair.ac.id</b> (login) → tekan <b>F12</b> → tab <b>Console</b> → kalau muncul peringatan, ketik <b>allow pasting</b> lalu Enter.</li>'+
        '<li>Salin kode dari bagian “buat tombolmu” → tempel di Console → Enter. File <b>hebat-links-…json</b> terunduh.</li>'+
        '<li>Seret file itu ke kotak di tab <b>📋 Tugas</b>. Tombol muncul ±1 menit kemudian (muat ulang halamannya).</li></ol>'+
        '<div class="hint">Data dibuat di <b>browser kamu</b> (sesi login HE-BAT kamu) — tidak ada password yang melewati web ini.</div>')+
      s('🛠 4. Kalau ada masalah',
        '<div class="hint" style="line-height:1.8">'+
        '• <b>“HTTP 0” / timeout saat masuk</b> → server Kampus Kita memblokir WiFi rumah. Ganti ke <b>data seluler / USB tethering HP</b>.<br>'+
        '• <b>“email dan password wajib”</b> → email harus <b>@student.unair.ac.id</b> sesuai akun Kampus Kita.<br>'+
        '• <b>Tugas tidak muncul</b> → periksa URL kalender masih valid (ambil ulang kalau perlu), lalu muat ulang halaman.<br>'+
        '• <b>Tombol tidak muncul</b> → data akunmu belum ada atau kelasnya berbeda; ikuti langkah 3.<br>'+
        '• <b>Mau ganti akun</b> → tombol <b>⏻</b>, lalu login ulang.</div>')+
      s('🔒 5. Privasi & keamanan',
        '<div class="hint" style="line-height:1.8">'+
        '• Semua data = <b>akunmu sendiri</b>. Token Kampus Kita & URL kalender tersimpan hanya di perangkatmu (localStorage).<br>'+
        '• <b>Jangan bagikan</b> URL kalender HE-BAT (kunci akses) atau token ke siapa pun.<br>'+
        '• Data tombol di repo publik hanya berisi info kursus & tugas (konten dosen) — <b>bukan</b> nilai, status kumpul, atau data pribadi.</div>');
  }
};
document.querySelectorAll('nav button').forEach(b=>b.onclick=async()=>{
  document.querySelectorAll('nav button').forEach(x=>x.classList.remove('on'));
  b.classList.add('on');
  const err=$('err'); err.style.display='none'; $('view').innerHTML='<div class="empty">memuat…</div>';
  try{ await VIEWS[b.dataset.v](); }catch(e){ err.style.display='block'; err.textContent='Gagal: '+e.message+(e.message.includes('token')?'':' — cek jaringan (butuh data seluler/tethering)'); }
});
function copyGenCode(){
  const ta=$('gencode'); if(!ta) return;
  const done=()=>{ const b=$('gencopybtn'); if(b){ const t=b.textContent; b.textContent='✓ tersalin'; setTimeout(()=>b.textContent=t,1500); } };
  if(navigator.clipboard&&navigator.clipboard.writeText){ navigator.clipboard.writeText(ta.value).then(done).catch(()=>{ ta.select(); document.execCommand('copy'); done(); }); }
  else { ta.select(); document.execCommand('copy'); done(); }
}
// Isi textarea kode generator + pasang handler drop/pilih file.
async function initGenHelp(){
  try{ const t=await (await fetch('generator-hebat.js')).text(); const ta=$('gencode'); if(ta) ta.value=t; }catch(e){}
  const dz=$('dropzone'), fi=$('genfile'), st=$('upstatus');
  if(!dz) return;
  const onFile=f=>{
    if(!f) return;
    if(!/^hebat-links-\d+\.json$/.test(f.name)){ if(st) st.textContent='⚠️ nama file harus hebat-links-<userid>.json (sesuai hasil generator)'; return; }
    uploadGen(f);
  };
  dz.onclick=()=>fi.click();
  fi.onchange=()=>{ onFile(fi.files[0]); fi.value=''; };
  dz.ondragover=e=>{ e.preventDefault(); dz.style.borderColor='var(--fg)'; dz.style.color='var(--fg)'; };
  dz.ondragleave=()=>{ dz.style.borderColor='var(--accent)'; dz.style.color='var(--muted)'; };
  dz.ondrop=e=>{ e.preventDefault(); dz.style.borderColor='var(--accent)'; dz.style.color='var(--muted)'; onFile(e.dataTransfer.files[0]); };
}
async function uploadGen(file){
  const st=$('upstatus'); if(!st) return;
  try{
    const data=JSON.parse(await file.text());
    const m=file.name.match(/^hebat-links-(\d+)\.json$/);
    const fid=m?m[1]:'';
    const calUid=(moodleCalParts(getMoodleCal())||{}).userid||'';
    if(calUid&&fid&&fid!==calUid){ st.innerHTML='⚠️ userid file ('+esc(fid)+') beda dengan userid kalendermu ('+esc(calUid)+') — tombol tidak akan cocok. Pakai file dari akun yang sama dengan kalender.'; return; }
    st.textContent='⏳ mengirim & commit… (20–40 detik)';
    const r=await fetch('/api/links-upload',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({userid:fid,data})});
    const j=await r.json().catch(()=>({}));
    if(!r.ok){ st.textContent='❌ '+(j.error||('HTTP '+r.status)); return; }
    st.innerHTML='✅ <b>berhasil!</b> '+esc(j.path)+' masuk repo. Tombol muncul setelah situs di-update — muat ulang halaman ini ±1 menit lagi.';
  }catch(e){ st.textContent='❌ gagal baca file: '+e.message; }
}
function boot(){
  if(!getTok()){ setupView(); return; }
  $('meta').textContent='tersambung ke Kampus Kita';
  document.querySelectorAll('nav button')[0].click();
}
$('out').onclick=()=>{ localStorage.removeItem('kk_token'); localStorage.removeItem('kk_moodle_cal'); setupView(); };
if('serviceWorker' in navigator) addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
boot();
</script></body></html>
