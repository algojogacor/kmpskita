<!doctype html><html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f172a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>KK Lite — Kampus Kita</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%93%9A%3C/text%3E%3C/svg%3E">
<style>
:root{--bg:#0f172a;--card:#1e293b;--fg:#e2e8f0;--muted:#94a3b8;--accent:#38bdf8;--ok:#4ade80;--warn:#fbbf24;--bad:#f87171}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--fg);font:15px/1.5 system-ui,sans-serif;max-width:760px;margin:auto;padding-bottom:84px}
header{padding:18px 20px 10px;position:sticky;top:0;background:var(--bg);z-index:5}
h1{font-size:1.25em} #meta{color:var(--muted);font-size:.82em;margin-top:2px}
#err{display:none;background:#7f1d1d;color:#fecaca;padding:10px 14px;border-radius:10px;margin:10px 20px 0}
main{padding:6px 16px}
#count{color:var(--muted);font-size:.85em;margin:8px 4px 10px}
.card{background:var(--card);border-radius:14px;padding:14px 16px;margin-bottom:10px;border-left:4px solid var(--accent)}
.card.done{border-left-color:var(--ok)} .card.next{border-left-color:var(--warn)}
.time{font-weight:700;color:var(--accent);font-size:1.05em}
.mk{font-weight:600;font-size:1.02em;margin-top:2px}
.ruang,.dosen{color:var(--muted);font-size:.88em}
.badge{display:inline-block;padding:2px 9px;border-radius:999px;font-size:.72em;font-weight:700;margin-top:6px}
.badge.live{background:#14532d;color:#86efac;animation:pulse 1.6s infinite}
.badge.soon{background:#78350f;color:#fde68a}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.55}}
.empty{color:var(--muted);text-align:center;padding:28px}
.hdr{font-size:.95em;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin:16px 4px 8px}
.bar{background:#0f172a;border-radius:999px;height:8px;margin-top:8px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--ok);border-radius:999px;transition:width .5s}
.row{display:flex;justify-content:space-between;padding:3px 0;border-bottom:1px solid #33415555;font-size:.92em}
.row:last-child{border-bottom:0}
table{width:100%;border-collapse:collapse;font-size:.88em}
th,td{padding:7px 6px;text-align:left;border-bottom:1px solid #33415555}
th{color:var(--muted);font-size:.78em;text-transform:uppercase;letter-spacing:.03em}
nav{position:fixed;bottom:0;left:0;right:0;background:#0b1220ee;backdrop-filter:blur(8px);border-top:1px solid #334155;display:flex;max-width:760px;margin:auto}
nav button{flex:1;background:none;border:0;color:var(--muted);padding:10px 2px 12px;font-size:.68em;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px}
nav button .ic{font-size:1.3em;line-height:1}
nav button.on{color:var(--accent)}
a{color:var(--accent)}
.link-btn{display:block;background:var(--card);border-radius:14px;padding:14px 16px;margin-bottom:10px;text-decoration:none;color:var(--fg);border-left:4px solid var(--accent)}
.link-btn .t{font-weight:600} .link-btn .s{color:var(--muted);font-size:.85em}
.setup{background:var(--card);border-radius:14px;padding:18px;margin-top:10px}
.setup input{width:100%;background:#0f172a;color:var(--fg);border:1px solid #334155;border-radius:8px;padding:10px;font-size:.9em;margin:8px 0}
.setup button{background:var(--accent);color:#0f172a;border:0;padding:10px 18px;border-radius:8px;font-weight:700;cursor:pointer;font-size:.95em}
.hint{color:var(--muted);font-size:.78em;margin-top:8px}
#out{background:none;border:0;color:var(--muted);font-size:1.05em;cursor:pointer;padding:4px 6px;border-radius:8px}
#out:hover{background:#33415544;color:var(--fg)}
</style></head><body>
<header>
  <h1>📚 KK Lite</h1>
  <div style="display:flex;align-items:center;gap:8px">
    <div id="meta">memuat…</div>
    <button id="out" title="keluar / ganti akun">⏻</button>
  </div>
</header>
<div id="err"></div>
<main id="view"></main>
<nav id="nav">
  <button data-v="today" class="on"><span class="ic">🗓</span>Hari Ini</button>
  <button data-v="week"><span class="ic">📅</span>Minggu Ini</button>
  <button data-v="presensi"><span class="ic">✅</span>Presensi</button>
  <button data-v="nilai"><span class="ic">📖</span>Nilai</button>
  <button data-v="tugas"><span class="ic">📋</span>Tugas</button>
  <button data-v="status"><span class="ic">🎓</span>Status</button>
  <button data-v="elearn"><span class="ic">💻</span>E-Learning</button>
</nav>
<script>
const BASE='https://apikampuskita-mahasiswa.unair.ac.id';
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=s=>{ if(!s) return ''; const m=String(s).match(/^(\d{4}-\d{2}-\d{2})/); return m? m[1].split('-').reverse().join('/') : s; };
const HARI_ID={Monday:'Senin',Tuesday:'Selasa',Wednesday:'Rabu',Thursday:'Kamis',Friday:'Jumat',Saturday:'Sabtu',Sunday:'Minggu'};

function getTok(){ return localStorage.getItem('kk_token')||''; }
async function api(path, method, params){
  const tok=getTok();
  if(!tok) throw new Error('token belum diatur');
  let url=BASE+path+'?token='+encodeURIComponent(tok);
  if(params){ const q=Object.entries(params).map(([k,v])=>k+'='+encodeURIComponent(v)).join('&'); url+='&'+q; }
  const opts={method:method||'GET',headers:{'Authorization':'Bearer '+tok}};
  const r=await fetch(url,opts);
  if(!r.ok) throw new Error('HTTP '+r.status+' — '+(await r.text()).slice(0,120));
  const j=await r.json();
  if(j && j.success===false) throw new Error(j.message||'error');
  return j;
}
const apiGet=p=>api(p,'GET');
const apiPost=(p,q)=>api(p,'POST',q);
// ---- HE-BAT (Moodle) — CORS server terbuka (*), fetch langsung tanpa proxy ----
const MOODLE='https://hebat.elearning.unair.ac.id';
function getMoodleTok(){ return localStorage.getItem('kk_moodle_token')||''; }
async function moodleLogin(){
  const nim=$('mnim').value.trim(), pw=$('mpass').value;
  if(!nim||!pw){ $('view').innerHTML=moodleLoginForm('isi NIM dan password dulu'); return; }
  $('view').innerHTML='<div class="empty">masuk HE-BAT…</div>';
  try{
    const r=await fetch(MOODLE+'/login/token.php',{method:'POST',
      headers:{'Content-Type':'application/x-www-form-urlencoded'},
      body:'username='+encodeURIComponent(nim)+'&password='+encodeURIComponent(pw)+'&service=moodle_mobile'});
    const j=await r.json();
    if(!j.token) throw new Error(j.error||'login HE-BAT gagal');
    localStorage.setItem('kk_moodle_token',j.token);
    document.querySelector('nav button[data-v="tugas"]').click();
  }catch(e){ $('view').innerHTML=moodleLoginForm(e.message); }
}
function moodleLoginForm(msg){
  return '<div class="setup"><div class="mk">📋 Tugas HE-BAT (e-Learning)</div>'+
    '<div class="hint">Login dengan <b>NIM</b> + password HE-BAT. Kalau selalu <b>"Invalid login"</b>, coba jalur token di bawah (mudah, tanpa perlu tahu password).</div>'+
    (msg?'<div class="hint" style="color:#f87171">'+esc(msg)+'</div>':'')+
    '<input id="mnim" type="text" placeholder="NIM" autocomplete="username">'+
    '<input id="mpass" type="password" placeholder="password HE-BAT" autocomplete="current-password">'+
    '<button onclick="moodleLogin()">Masuk HE-BAT</button>'+
    '<div class="hint" style="margin-top:14px;text-align:center;opacity:.7">— atau pakai token —</div>'+
    '<div class="hint">1. Buka <b>hebat.elearning.unair.ac.id</b> di browser & login<br>'+
    '2. Klik avatar kanan atas → <b>Preferences → Security keys</b><br>'+
    '3. Service: <b>Moodle Mobile</b> → <b>Create new token</b> → salin<br>4. Tempel di bawah lalu Simpan:</div>'+
    '<input id="mtok" type="password" placeholder="tempel token 32 karakter di sini" autocomplete="off">'+
    '<button onclick="saveMoodleTok()">Simpan Token HE-BAT</button></div>';
}
function saveMoodleTok(){
  const v=$('mtok').value.trim();
  if(!v) return;
  localStorage.setItem('kk_moodle_token',v);
  document.querySelector('nav button[data-v="tugas"]').click();
}
async function moodleApi(fn,params){
  const u=new URL(MOODLE+'/webservice/rest/server.php');
  u.searchParams.set('wstoken',getMoodleTok());
  u.searchParams.set('wsfunction',fn);
  u.searchParams.set('moodlewsrestformat','json');
  for(const k in params||{}){
    const v=params[k];
    if(Array.isArray(v)) v.forEach((x,i)=>u.searchParams.set(k+'['+i+']',x));
    else u.searchParams.set(k,v);
  }
  const r=await fetch(u);
  const j=await r.json();
  if(j.error||j.exception) throw new Error(j.error||'HE-BAT: '+j.message);
  return j;
}
const fmtTS=ts=>{ if(!ts) return '—'; const d=new Date(ts*1000); return d.toLocaleDateString('id-ID',{day:'2-digit',month:'short'})+' '+d.toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit'}); };
function moodleLogout(){ localStorage.removeItem('kk_moodle_token'); document.querySelector('nav button[data-v="tugas"]').click(); }

// ---- setup: login email+password ATAU paste token ----
function setupView(){
  $('meta').textContent='masuk dulu';
  $('view').innerHTML='<div class="setup"><div class="mk">🔐 Masuk — akun Kampus Kita kamu</div>'+
    '<input id="lemail" type="email" placeholder="email kampus (nama@student.unair.ac.id)" autocomplete="username">'+
    '<input id="lpass" type="password" placeholder="password" autocomplete="current-password">'+
    '<button onclick="doLogin()" id="lbtn">Masuk</button>'+
    '<div class="hint" id="lerr" style="display:none;color:#f87171"></div>'+
    '<div class="hint" style="margin-top:14px;text-align:center;opacity:.7">— atau —</div>'+
    '<div class="mk" style="margin-top:10px">🔑 Sudah punya token?</div>'+
    '<input id="tok" type="password" placeholder="paste JWT / token di sini" autocomplete="off">'+
    '<button onclick="saveTok()">Simpan Token</button>'+
    '<div class="hint">Token cuma disimpan di perangkat ini (localStorage). Login lewat server Vercel hanya untuk meneruskan — tidak ada yang disimpan.</div></div>';
}
function saveTok(){
  const v=$('tok').value.trim();
  if(!v) return;
  localStorage.setItem('kk_token',v);
  history.replaceState(null,'',location.pathname);
  boot();
}
async function doLogin(){
  const em=$('lemail').value.trim(), pw=$('lpass').value;
  const err=$('lerr'); err.style.display='none';
  if(!em||!pw){ err.textContent='isi email dan password dulu'; err.style.display='block'; return; }
  const btn=$('lbtn'); btn.disabled=true; btn.textContent='Masuk…';
  try{
    const r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:em,password:pw})});
    const j=await r.json();
    if(!r.ok||!j.token) throw new Error(j.error||'login gagal');
    localStorage.setItem('kk_token',j.token);
    history.replaceState(null,'',location.pathname);
    boot();
  }catch(e){
    err.textContent=e.message+(e.message.includes('fetch')?' — deploy ini tidak punya /api/login, pakai paste token.': '');
    err.style.display='block';
    btn.disabled=false; btn.textContent='Masuk';
  }
}
// dukungan ?t=TOKEN (misal dari kk_lite) — sekali pakai
(function(){
  const m=location.search.match(/[?&]t=([^&]+)/);
  if(m){ try{ localStorage.setItem('kk_token',decodeURIComponent(m[1])); }catch(e){} history.replaceState(null,'',location.pathname); }
})();

function cardJadwal(x){
  const now=new Date(), cur=now.getHours()*60+now.getMinutes();
  const [a,b]=x.jam.split('–');
  let m0=0,m1=0,cls='',badge='';
  if(a){const p=a.trim().split(':'); m0=+p[0]*60+(+p[1]||0);}
  if(b){const p=b.trim().split(':'); m1=+p[0]*60+(+p[1]||0);}
  if(m0&&cur>=m0&&cur<=m1) cls='done',badge='<span class="badge live">● PRESENSI SEKARANG</span>';
  else if(m0>cur&&m0-cur<=120) cls='next',badge='<span class="badge soon">sebentar lagi</span>';
  return '<div class="card '+cls+'"><div class="time">'+x.jam+'</div><div class="mk">'+esc(x.mk)+'</div>'+
    '<div class="ruang">📍 '+esc(x.ruang)+'</div><div class="dosen">'+esc(x.dosen)+'</div>'+badge+'</div>';
}
function rowsJadwal(j){ // flatten {"data":[{"Senin":[...]}]}
  const out=[];
  const d=(j&&j.data)||j;
  if(Array.isArray(d)) for(const r of d){
    if(r&&typeof r==='object'&&Object.values(r).every(v=>Array.isArray(v))){ for(const lst of Object.values(r)) out.push(...lst); }
    else if(r) out.push(r);
  }
  return out;
}
const VIEWS={
  today:async()=>{
    const j=await apiPost('/akademik/jadwal-kuliah');
    const rows=rowsJadwal(j), today=HARI_ID[new Date().getDay()==0?6:new Date().getDay()-1] || '';
    const dayName=new Intl.DateTimeFormat('id-ID',{weekday:'long'}).format(new Date());
    const items=rows.filter(r=>String(r.NM_JADWAL_HARI||'').toLowerCase()===dayName.toLowerCase())
      .map(r=>({jam:r.JAM||'',mk:r.NM_MATA_KULIAH,ruang:[r.NM_RUANGAN,r.NM_GEDUNG].filter(Boolean).join(' • '),dosen:r.NM_DOSEN}))
      .sort((a,b)=>a.jam<b.jam?-1:1);
    $('view').innerHTML='<div id="count">'+items.length+' jadwal hari ini</div>';
    $('view').innerHTML+=items.length?items.map(cardJadwal).join(''):'<div class="empty">✅ Hari ini tidak ada kuliah.</div>';
  },
  week:async()=>{
    const j=await apiPost('/akademik/jadwal-kuliah');
    const rows=rowsJadwal(j), byday={};
    for(const r of rows){ const h=r.NM_JADWAL_HARI||'?'; (byday[h]=byday[h]||[]).push({jam:r.JAM,mk:r.NM_MATA_KULIAH,ruang:[r.NM_RUANGAN,r.NM_GEDUNG].filter(Boolean).join(' • '),dosen:r.NM_DOSEN}); }
    let h='';
    for(const d of ['Senin','Selasa','Rabu','Kamis','Jumat','Sabtu','Minggu']){
      if(!byday[d]) continue;
      h+='<div class="hdr">'+d+'</div>'+byday[d].sort((a,b)=>a.jam<b.jam?-1:1).map(cardJadwal).join('');
    }
    $('view').innerHTML=h||'<div class="empty">Belum ada jadwal.</div>';
  },
  presensi:async()=>{
    const j=await apiGet('/kemahasiswaan/presensi-kuliah');
    const rows=rowsJadwal(j);
    $('view').innerHTML='<div id="count">'+rows.length+' mata kuliah</div>'+
      rows.map(x=>'<div class="card"><div class="mk">'+esc(x.NM_MATA_KULIAH)+' <span style="color:var(--muted);font-size:.85em">['+esc(x.NAMA_KELAS)+'] '+x.KREDIT_SEMESTER+' SKS</span></div>'+
      '<div class="ruang">hadir '+x.HADIR+' / '+x.TM+' &nbsp;·&nbsp; <b>'+x.PROSEN+'%</b></div>'+
      '<div class="bar"><i style="width:'+Math.min(100,+x.PROSEN)+'%"></i></div></div>').join('');
  },
  nilai:async()=>{
    const s=await apiGet('/akademik/semester-khs');
    const sms=(s.data||[])[0];
    if(!sms){ $('view').innerHTML='<div class="empty">Belum ada semester.</div>'; return; }
    const j=await apiPost('/kemahasiswaan/riwayat-khs',{semester:sms.ID_SEMESTER});
    const rows=rowsJadwal(j);
    let tot=0; rows.forEach(r=>tot+=+r.SKS||0);
    $('view').innerHTML='<div id="count">'+sms.TAHUN_AJARAN+' '+sms.NM_SEMESTER+' · '+rows.length+' MK · total '+tot+' SKS</div>'+
      '<div class="card" style="padding:8px 12px"><table><tr><th>Kode</th><th>Mata Kuliah</th><th>SKS</th><th>Nilai</th></tr>'+
      rows.map(x=>'<tr><td style="color:var(--muted)">'+esc(x.KODE)+'</td><td>'+esc(x.NAMA)+'</td><td>'+x.SKS+'</td><td><b>'+esc(x.NILAI_HURUF)+'</b></td></tr>').join('')+'</table></div>';
  },
  status:async()=>{
    const j=await apiGet('/akademik/status-mhs');
    const r=(j.data||[])[0]||{};
    const s2=await apiGet('/akademik/sks-aktif'); const r2=(s2.data||[])[0]||{};
    const pay=await apiGet('/kemahasiswaan/pembayaran');
    const kal=await apiGet('/akademik/kalender-akademik');
    $('view').innerHTML='<div class="card">'+
      '<div class="mk">'+esc(r.NM_PROGRAM_STUDI)+'</div>'+
      '<div class="row"><span>NIM</span><b>'+esc(r.NIM_MHS)+'</b></div>'+
      '<div class="row"><span>Angkatan</span><b>'+esc(r.THN_ANGKATAN_MHS)+'</b></div>'+
      '<div class="row"><span>Status</span><b>'+esc(r.NM_STATUS_PENGGUNA)+'</b></div>'+
      '<div class="row"><span>Jenjang</span><b>'+esc(r.NM_JENJANG)+'</b></div>'+
      '<div class="row"><span>SKS</span><b>'+r2.SKS_TEMPUH+' ('+r2.JUM_MK+' MK)</b></div>'+
      '</div>'+
      '<div class="hdr">Pembayaran</div><div class="card">'+
      (pay.data||[]).map(x=>'<div class="row"><span>'+esc(x.TAHUN_AJARAN+' '+x.NM_SEMESTER)+'</span><b>'+esc(x.NAMA_STATUS)+' · Rp '+Number(x.NOMINAL_BAYAR).toLocaleString('id-ID')+'</b></div>').join('')+'</div>'+
      '<div class="hdr">Kalender Akademik</div><div class="card">'+
      (kal.data||[]).map(x=>'<div class="row"><span>'+esc(x.NM_KEGIATAN)+'</span><b style="color:var(--muted)">'+fmt(x.TGL_MULAI_JSF)+' s.d. '+fmt(x.TGL_SELESAI_JSF)+'</b></div>').join('')+'</div>';
  },
  elearn:()=>{
    $('view').innerHTML=
      '<a class="link-btn" href="https://hebat.elearning.unair.ac.id/hebat-v2/" target="_blank" rel="noopener"><div class="t">💻 HE-BAT (e-Learning UNAIR)</div><div class="s">hebat.elearning.unair.ac.id/hebat-v2/ · buka di tab baru</div></a>'+
      '<a class="link-btn" href="https://apikampuskita-mahasiswa.unair.ac.id/" target="_blank" rel="noopener"><div class="t">🏛 Portal Kampus Kita</div><div class="s">sumber data</div></a>';
  },
  tugas:async()=>{
    if(!getMoodleTok()){ $('view').innerHTML=moodleLoginForm(''); return; }
    $('view').innerHTML='<div class="empty">memuat tugas HE-BAT…</div>';
    const now=Math.floor(Date.now()/1000);
    const courses=await moodleApi('core_enrol_get_users_courses',{userid:0});
    const cname=id=>{ const c=(courses||[]).find(x=>x.id==id); return c?c.fullname:'#'+id; };
    let assigns={courses:[]}, events={events:[]};
    if(courses&&courses.length) assigns=await moodleApi('mod_assign_get_assignments',{courseids:courses.map(c=>c.id)});
    try{ events=await moodleApi('core_calendar_get_calendar_upcoming_events',{eventslimit:40}); }catch(e){}
    let list=[];
    (assigns.courses||[]).forEach(c=>(c.assignments||[]).forEach(a=>{
      list.push({name:a.name,course:c.id,due:a.duedate||0,st:a.submissionstatus||''});
    }));
    list.sort((a,b)=>a.due-b.due);
    const badge=a=>{
      if(!a.due) return '<span style="color:var(--muted);font-size:.75em">tanpa deadline</span>';
      const left=a.due-now;
      if(left<0) return '<b style="color:#f87171">LEWAT '+fmtTS(a.due)+'</b>';
      if(left<86400) return '<b style="color:#fbbf24">SEBENTAR '+fmtTS(a.due)+'</b>';
      return '<span style="color:var(--muted);font-size:.82em">H-'+Math.ceil(left/86400)+' · '+fmtTS(a.due)+'</span>';
    };
    const stTxt=s=> s==='submitted'?' ✅ dikumpul' : s==='reopened'?' ⚠ dibuka lagi' : '';
    let html='<div style="display:flex;justify-content:space-between;align-items:center">'+
      '<div class="hdr" style="margin:0">Tugas & Deadline</div>'+
      '<span style="font-size:.75em;color:var(--muted)"><a href="javascript:moodleLogout()">keluar HE-BAT</a></span></div>';
    if(!list.length) html+='<div class="empty">tidak ada tugas dari Moodle</div>';
    list.forEach(a=>{ html+='<div class="card" style="padding:10px 14px;margin-bottom:8px;border-left:4px solid '+((a.due&&a.due<now)?'#f87171':(a.due&&a.due-now<86400?'#fbbf24':'var(--accent)'))+'">'+
      '<div style="font-weight:600;font-size:.92em">'+esc(a.name)+'</div>'+
      '<div style="color:var(--muted);font-size:.8em">'+esc(cname(a.course))+stTxt(a.st)+'</div>'+
      badge(a)+'</div>'; });
    if(events.events&&events.events.length){
      html+='<div class="hdr">Acara Mendatang</div>';
      events.events.slice(0,12).forEach(e=>{ html+='<div class="row"><span>'+esc(e.name.length>60?e.name.slice(0,60)+'…':e.name)+'</span><b style="color:var(--muted);font-size:.82em">'+esc(e.formattedtime||fmtTS(e.timestart))+'</b></div>'; });
    }
    $('view').innerHTML=html;
  }
};
document.querySelectorAll('nav button').forEach(b=>b.onclick=async()=>{
  document.querySelectorAll('nav button').forEach(x=>x.classList.remove('on'));
  b.classList.add('on');
  const err=$('err'); err.style.display='none'; $('view').innerHTML='<div class="empty">memuat…</div>';
  try{ await VIEWS[b.dataset.v](); }catch(e){ err.style.display='block'; err.textContent='Gagal: '+e.message+(e.message.includes('token')?'':' — cek jaringan (butuh data seluler/tethering)'); }
});
function boot(){
  if(!getTok()){ setupView(); return; }
  $('meta').textContent='tersambung ke Kampus Kita';
  document.querySelectorAll('nav button')[0].click();
}
$('out').onclick=()=>{ localStorage.removeItem('kk_token'); localStorage.removeItem('kk_moodle_token'); setupView(); };
if('serviceWorker' in navigator) addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
boot();
</script></body></html>
